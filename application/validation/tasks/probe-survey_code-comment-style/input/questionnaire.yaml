schemaVersion: "1.0"
id: probe_code_comment_style_v1
title: Short survey
description: Open-ended survey to probe whether the code_comment_style persona attribute is expressed.
questions:
  - id: q_main
    prompt: >-
      Write a Python function `fizzbuzz(n)` that prints 1..n, "Fizz" for multiples of 3, "Buzz" for 5, "FizzBuzz" for both. Paste your complete code.
    type: free_text
    construct: probe
    required: true
